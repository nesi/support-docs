name: Checks
env:
  MODULE_LIST_PATH: docs/assets/module-list.json
on:
  push:
    branches-ignore: [main]
  repository_dispatch:
  workflow_dispatch:
    inputs:
      fileList:
        description: Files to Lint (space delimited). Use `docs/**/*.md` to lint all.
        required: true
        default: "docs/CONTRIBUTING.md"
        type: string
      checkSpelling:
        description: Check Spelling
        default: true
        type: boolean
      checkProse:
        description: Check Prose
        default: true
        type: boolean
      checkMarkdown:
        description: Check Markdown
        default: true
        type: boolean
      checkMeta:
        description: Check Meta
        default: true
        type: boolean
      checkSlurm:
        description: Check Slurm
        default: true
        type: boolean
      checkA11y:
        description: Check Accessibility (WCAG)
        default: true
        type: boolean
      testBuild:
        description: Test Build
        default: true
        type: boolean

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -O extglob -O globstar {0}

jobs:
  get:
    name: Determine what files to check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Push Changed files to output
        if: inputs.fileList == ''
        id: diff
        env:
          # `github.base_ref` is only populated on pull_request events; this
          # workflow triggers on push, so fall back to the default branch.
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          # `|| true` only absorbs grep's own "no markdown files matched" exit
          # code - pipefail still lets a bad/missing origin/$BASE ref from the
          # `git diff` above it fail the step loudly.
          changed_files="$(git diff --name-only "origin/${BASE}...HEAD" | { grep -E '^docs/.*\.md$' || true; } | tr '\n' ' ')"
          echo "Changed files: '${changed_files}'"
          echo "filelist=${changed_files}" >> $GITHUB_OUTPUT
    outputs:
      filelist: ${{steps.diff.outputs.filelist || inputs.fileList}}
  spellcheck:
    name: Check Spelling
    if: ${{ needs.get.outputs.filelist && (github.event_name != 'workflow_dispatch' || inputs.checkSpelling) }}
    runs-on: ubuntu-24.04
    needs: get
    steps:
      - name: Check out repo.
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt install -y aspell
          pip3 install $(grep ^pyspelling requirements.txt)
          pip3 install $(grep ^flashtext requirements.txt)
      - name: Run pyspelling
        run: python3 checks/run_spell_check.py ${{needs.get.outputs.filelist}}
  proselint:
    name: Check Prose
    if: ${{ needs.get.outputs.filelist && (github.event_name != 'workflow_dispatch' || inputs.checkProse) }}
    runs-on: ubuntu-24.04
    needs: get
    steps:
      - name: Check out repo.
        uses: actions/checkout@v6
      - name: Install dependencies
        run: pip3 install $(grep ^proselint requirements.txt)
      - name: Run proselint
        run: python3 checks/run_proselint.py ${{needs.get.outputs.filelist}}
  mdlint:
    name: Check Markdown
    if: ${{ needs.get.outputs.filelist && (github.event_name != 'workflow_dispatch' || inputs.checkMarkdown) }}
    runs-on: ubuntu-24.04
    needs: get
    steps:
      - name: Check out repo.
        uses: actions/checkout@v6
      - name: Install dependencies
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: set +o pipefail && markdownlint --config .markdownlint.json --json ${{needs.get.outputs.filelist}} 2>&1 | python3 checks/parse_markdownlint.py

  metacheck:
    name: Check page meta
    if: ${{ needs.get.outputs.filelist && (github.event_name != 'workflow_dispatch' || inputs.checkMeta) }}
    runs-on: ubuntu-24.04
    needs: get
    steps:
      - name: Check out repo.
        uses: actions/checkout@v6
      - name: Install dependencies
        run: pip3 install titlecase
      - name: Check markdown meta.
        run: python3 checks/run_meta_check.py ${{needs.get.outputs.filelist}}
      - name: Run ARIA reference check (meta checks)
        run: |
          pip3 install -r requirements.txt
          mkdocs build
          python3 checks/run_aria_check.py
  slurmcheck:
    name: Check slurm scripts
    if: ${{ needs.get.outputs.filelist && (github.event_name != 'workflow_dispatch' || inputs.checkSlurm) }}
    runs-on: ubuntu-24.04
    needs: get
    steps:
      - name: Check out repo.
        uses: actions/checkout@v6
      - name: Check slurm scripts.
        run: python3 checks/run_slurm_lint.py ${{needs.get.outputs.filelist}}
  a11ycheck:
    name: Check accessibility (WCAG)
    if: ${{ needs.get.outputs.filelist && (github.event_name != 'workflow_dispatch' || inputs.checkA11y) }}
    runs-on: ubuntu-24.04
    # Ships Chromium and its OS-level dependencies preinstalled.
    container: mcr.microsoft.com/playwright:latest
    needs: get
    steps:
      - name: Check out repo.
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip git
          pip3 install --upgrade pip setuptools wheel
          pip3 install -r requirements.txt
      - name: Build site
        run: mkdocs build
      - name: Cache AccessLint audit tool
        uses: actions/cache@v4
        with:
          path: ~/.cache/accesslint-audit
          key: accesslint-audit-v0-${{ runner.os }}
      - name: Run WCAG audit
        run: ./checks/run_a11y_check.sh serious ${{needs.get.outputs.filelist}} | python3 checks/parse_a11y_report.py

  tagcheck:
    name: Compile tags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pip3 install pyyaml
      - run: python3 .github/workflows/compile_tags.py

  testBuild:
    name: Test build
    if: ${{github.event_name != 'workflow_dispatch' || inputs.testBuild}}
    runs-on: ubuntu-24.04
    needs: [get, tagcheck]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: pip3 install -r requirements.txt
      - run: python3 .github/workflows/compile_tags.py
      - run: ./checks/run_test_build.py
      - run: export NO_MKDOCS_2_WARNING="1"; python3 checks/run_aria_check.py
