name: Deploy to gh-pages 
on: 
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * *' # Should run 1 hour after module list update.
env:
  PYTHON_VERSION: 3.14.2
  GH_TOKEN: ${{ github.token }}
  NO_MKDOCS_2_WARNING: "1"

permissions:
  contents: write
  pull-requests:  write
  id-token: write
  pages: write
jobs:
  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      # This step installs the required system dependencies for lxml
      - name: Install lxml dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev python3-dev
        shell: bash
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            docs
            overrides
            .github
      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up build cache
        uses: actions/cache/restore@v4
        with:
          key: mkdocs-${{ hashfiles('.cache/**') }}
          path: .cache
          restore-keys: |
            mkdocs-
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Fetch Remote Files
        run: bash .github/fetch_includes.sh
      - name: Compile tag index and link app pages
        run: python3 .github/workflows/compile_tags.py
      - name: Build documentation
        run: |
              mkdocs build --clean --quiet
      - name: Adjust permissions
        run: |
          chmod -c -R +rX public/ | while read line; do
            echo "::info title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Save build cache
        uses: actions/cache/save@v4
        with:
          key: mkdocs-${{ hashfiles('.cache/**') }}
          path: .cache

  rag-ingest:
    name: Refresh RAG index
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout support-docs
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            docs
            overrides
            .github
      - name: Checkout nesi-docs-rag
        # Lives on GitLab (gitlab.com/nesi1/nesi-rst/nesi-docs-rag), not GitHub,
        # so actions/checkout can't reach it directly -- clone over SSH with a
        # read-only deploy key instead.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$RAG_DEPLOY_KEY"
          git clone --depth 1 git@gitlab.com:nesi1/nesi-rst/nesi-docs-rag.git nesi-docs-rag
        env:
          RAG_DEPLOY_KEY: ${{ secrets.NESI_DOCS_RAG_DEPLOY_KEY }}
      - name: Fetch Remote Files
        run: bash .github/fetch_includes.sh
      - name: Run ingest
        working-directory: nesi-docs-rag
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ingest_local.sh ../docs
