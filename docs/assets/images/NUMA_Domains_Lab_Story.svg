<svg xmlns="http://www.w3.org/2000/svg" width="788" height="484" viewBox="0 0 788 484" role="img" aria-labelledby="title desc" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Near and far memory, told as a story about labs</title>
<desc id="desc">Two buildings joined by a footbridge. Each building has 4 labs, and each lab has scientists and a fridge. A scientist in lab 0 fetches a sample from the fridge in their own lab (quick), from lab 1 in the same building (slower), and from lab 4 in the other building, over the footbridge (slowest).</desc>
