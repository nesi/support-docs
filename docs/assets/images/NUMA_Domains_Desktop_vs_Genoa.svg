<svg xmlns="http://www.w3.org/2000/svg" width="771" height="770" viewBox="0 0 771 770" role="img" aria-labelledby="title desc" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">A desktop processor and a Genoa node, drawn to the same scale</title>
<desc id="desc">The desktop has one processor, about 4 cm across, with its memory slots on one side, all wired to the same part of the processor, so it has one NUMA domain. The Genoa node has two processors, each about 7.5 cm across, joined by a link, with six memory slots on each side of each processor. Each quarter of a Genoa processor, with its chips of cores and the memory slots wired to it, is one NUMA domain, giving 8 in the node.</desc>
