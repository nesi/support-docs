{% extends "base.html" -%}

{% block libs %}
    {{ super() }}
    <script src="{{ base_url }}/assets/javascripts/updates.js"></script>
{% endblock -%}
{% block styles %}
    {{ super() }}
    <link rel="stylesheet" href="{{ base_url }}/assets/stylesheets/updates.css">
{% endblock -%}
{% block content -%}
    {{ super() }}
    <nav style="display: none;" id="md-filter__options">
        <strong>Show Only:</strong>
        <span id="md-filter-tag-container">
        </span>
    </nav>
    <hr>
    <div id="md-feed" data-base-url="{{ base_url }}">
        <div id="md-feed__inner"></div>
        <div class="md-throbber"></div>
        <div class="md-feed-more">
            <span id="md-feed-count" aria-live="polite"></span>
            <button id="md-feed-more" class="md-button" type="button" hidden>Show more</button>
        </div>
    </div>

{% endblock -%}
